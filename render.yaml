services:
  # Express + MongoDB API
  - type: web
    name: phethagatsa-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Paste your MongoDB (Atlas or local) connection string when deploying.
      - key: MONGODB_URI
        sync: false
      # Optional: enables hosted card checkout.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # PayPal REST app credentials (Card & PayPal checkout).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      # Stitch (Pay by Bank) credentials (client token, client_paymentrequest scope).
      - key: STITCH_CLIENT_ID
        sync: false
      - key: STITCH_CLIENT_SECRET
        sync: false
      - key: STITCH_ENV
        value: test
      # Allowlisted Stitch redirect target (defaults to CORS_ORIGIN + /?stitch=return).
      - key: STITCH_REDIRECT_URI
        sync: false
      # Brevo transactional email (order receipts + password-reset OTP codes).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Phethagatsa Solutions
      # Where new-order notifications are sent (defaults to BREVO_SENDER_EMAIL).
      - key: ADMIN_EMAIL
        sync: false
      # Secret used to hash one-time codes.
      - key: OTP_SECRET
        sync: false
      # Google OAuth web client ID (verifies ID tokens at /api/auth/google).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Comma-separated allowed origins, or * . Defaults to * if unset.
      - key: CORS_ORIGIN
        sync: false

  # Vite React storefront (static)
  - type: web
    name: phethagatsa-solutions
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phethagatsa-api
          property: host
      # Google OAuth web client ID (public; rendered by the sign-in modal).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # PayPal public client ID (renders the Card & PayPal buttons).
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
